[project]
name = "proxora-engine"
version = "0.1.0"
description = "A next-value predictor comparing classical and variational quantum regression."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Qimono", email = "albert@qimono.vip" }
]
keywords = [
    "regression",
    "prediction",
    "quantum-computing",
    "machine-learning",
    "qiskit"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
    "numpy",
    "scipy",
    "qiskit",
    "qiskit-aer"
]

[project.optional-dependencies]
# pyQuil for the -opqaoa route (Rigetti QVM / QCS). Without it, -opqaoa
# samples the exact NumPy statevector and says so in its output.
rigetti = ["pyquil>=4"]

[project.scripts]
proxora = "proxora:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "proxora"

# Ship sitecustomize.py into the venv's site-packages (PEP 427 "purelib"
# wheel-data scheme). On this Guix host the Guix CPython loader does not
# search /usr/lib, so NumPy/SciPy/Qiskit-Aer wheels fail to dlopen libz.so.1
# unless a preload runs at interpreter start. Putting it in the wheel means
# every `uv sync` (including a recreated venv) reinstalls it, instead of
# relying on a manual copy into .venv/site-packages that silently disappears
# when the venv is rebuilt. See shim/sitecustomize.py and scripts/verify-env.sh.
[tool.uv.build-backend.data]
purelib = "shim"
